# --- original workflow ---
# # Weekly external link check, split out of the deploy.
# #
# # ── Why this is not a deploy step any more ────────────────────────────────
# # It used to run inside .github/workflows/deploy.yml, and the comment there
# # already said what was wrong with that: link rot is a property of *time*, not
# # of a deploy. A link that worked this morning does not break because you
# # pushed a CSS change, and a link that broke last Tuesday stays broken however
# # long you avoid deploying.
# #
# # The cost mattered in the end. The account exhausted its included Actions
# # allowance in September 2026, and with the spending limit at its $0 default
# # GitHub refuses to start any job at all -- so the cheapest run is the one that
# # does not happen. Twenty-five network fetches on every push bought nothing a
# # weekly run does not.
# #
# # ── Why there is no `npm ci` ──────────────────────────────────────────────
# # There is nothing to install. `scripts/check-links.mjs` imports no packages,
# # `content/portfolio.ts` imports nothing at all, and the TypeScript is handled
# # by `node --experimental-strip-types` with the local resolver hook in
# # `tests/ts-hooks.mjs`. Verified by running `npm run check:links` in a fresh
# # `git worktree` with no `node_modules`: 15 ok, 17 unverifiable by design, 0
# # failed. That takes the run from roughly a minute to a few seconds.
# #
# # If the checker ever grows a dependency it will fail here with a bare
# # ERR_MODULE_NOT_FOUND. Add `- run: npm ci` above the check and accept the
# # minute back.
